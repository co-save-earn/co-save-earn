<!DOCTYPE html>  <html lang="en">  
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>Authentication</title>  
    <!-- Include Supabase JS Client Library -->  
    <script src="https://jsdelivr.net"></script>  
    <style>  
        * {  
            box-sizing: border-box;  
            margin: 0;  
            padding: 0;  
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;  
        }  body {  
        background-color: #f4f7f6;  
        display: flex;  
        justify-content: center;  
        align-items: center;  
        height: 100vh;  
    }  

    .auth-container {  
        background-color: #ffffff;  
        padding: 40px;  
        border-radius: 8px;  
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);  
        width: 100%;  
        max-width: 400px;  
    }  

    .auth-container h2 {  
        margin-bottom: 24px;  
        color: #333333;  
        text-align: center;  
    }  

    .input-group {  
        margin-bottom: 16px;  
    }  

    .input-group label {  
        display: block;  
        margin-bottom: 6px;  
        color: #666666;  
        font-size: 14px;  
    }  

    .input-group input {  
        width: 100%;  
        padding: 12px;  
        border: 1px solid #cccccc;  
        border-radius: 4px;  
        font-size: 16px;  
        outline: none;  
        transition: border-color 0.2s;  
    }  

    .input-group input:focus {  
        border-color: #3ecf8e; /* Supabase Green Theme */  
    }  

    .auth-btn {  
        width: 100%;  
        padding: 12px;  
        background-color: #3ecf8e;  
        border: none;  
        border-radius: 4px;  
        color: #ffffff;  
        font-size: 16px;  
        font-weight: bold;  
        cursor: pointer;  
        transition: background-color 0.2s;  
        margin-top: 10px;  
    }  

    .auth-btn:hover {  
        background-color: #2eaf73;  
    }  

    .toggle-link {  
        text-align: center;  
        margin-top: 20px;  
        font-size: 14px;  
        color: #666666;  
    }  

    .toggle-link span {  
        color: #3ecf8e;  
        cursor: pointer;  
        font-weight: bold;  
    }  

    .toggle-link span:hover {  
        text-decoration: underline;  
    }  

    /* Message Styling */  
    .message {  
        padding: 10px;  
        margin-bottom: 15px;  
        border-radius: 4px;  
        font-size: 14px;  
        display: none;  
        text-align: center;  
    }  
    .error { background-color: #ffe6e6; color: #cc0000; border: 1px solid #ffcccc; display: block; }  
    .success { background-color: #e6ffe6; color: #008000; border: 1px solid #ccffcc; display: block; }  
      
    /* Utility hiding class */  
    .hidden { display: none; }  
</style>

</head>  
<body>  <div class="auth-container">  
    <!-- Auth Header Title -->  
    <h2 id="form-title">Sign In</h2>  
      
    <!-- UI status messages -->  
    <div id="message-box" class="message"></div>  

    <form id="auth-form">  
        <!-- Fields shared by both templates / Dynamic Display -->  
        <div class="input-group signup-field hidden">  
            <label for="username">Username</label>  
            <input type="text" id="username" autocomplete="username">  
        </div>  

        <div class="input-group signup-field hidden">  
            <label for="contact">Contact Number</label>  
            <input type="tel" id="contact" placeholder="e.g. +256...">  
        </div>  

        <div class="input-group">  
            <label for="email">Email Address</label>  
            <input type="email" id="email" required autocomplete="email">  
        </div>  
          
        <div class="input-group">  
            <label for="password">Password</label>  
            <input type="password" id="password" required autocomplete="current-password">  
        </div>  

        <button type="submit" id="submit-btn" class="auth-btn">Sign In</button>  

        <!-- Bottom Toggle Navigation -->  
        <div class="toggle-link" id="toggle-wrapper">  
            Don't have an account? <span id="switch-mode" onclick="toggleMode()">Sign Up</span>  
        </div>  
    </form>  
</div>  

<script>  
    // Initialize the Supabase Client with your project credentials  
    const SUPABASE_URL = "https://chjtxxwxhvjwpspmikme.supabase.co";  
    const SUPABASE_KEY = "sb_publishable_g8gM0qRrMveb8A7H3BLYYg_g21-SBKA";  
    const supabase = Supabase.createClient(SUPABASE_URL, SUPABASE_KEY);  

    // Core App variables  
    let isSignUpMode = false;  
    const formTitle = document.getElementById('form-title');  
    const submitBtn = document.getElementById('submit-btn');  
    const switchModeText = document.getElementById('switch-mode');  
    const toggleWrapper = document.getElementById('toggle-wrapper');  
    const signupFields = document.querySelectorAll('.signup-field');  
    const messageBox = document.getElementById('message-box');  

    // Toggle Form between Sign In & Sign Up templates  
    function toggleMode() {  
        isSignUpMode = !isSignUpMode;  
        clearMessage();  
          
        if (isSignUpMode) {  
            formTitle.textContent = "Create Account";  
            submitBtn.textContent = "Sign Up";  
            toggleWrapper.innerHTML = `Already have an account? <span onclick="toggleMode()">Sign In</span>`;  
            signupFields.forEach(field => field.classList.remove('hidden'));  
            // Set fields as required for signup validation  
            document.getElementById('username').required = true;  
            document.getElementById('contact').required = true;  
        } else {  
            formTitle.textContent = "Sign In";  
            submitBtn.textContent = "Sign In";  
            toggleWrapper.innerHTML = `Don't have an account? <span onclick="toggleMode()">Sign Up</span>`;  
            signupFields.forEach(field => field.classList.add('hidden'));  
            // Remove required flags for standard sign-in flow  
            document.getElementById('username').required = false;  
            document.getElementById('contact').required = false;  
        }  
    }  

    // Functional notification triggers  
    function showMessage(text, isError = true) {  
        messageBox.textContent = text;  
        messageBox.className = `message ${isError ? 'error' : 'success'}`;  
    }  
    function clearMessage() {  
        messageBox.textContent = '';  
        messageBox.className = 'message';  
    }  

    // Form Submission Event Pipeline  
    document.getElementById('auth-form').addEventListener('submit', async (e) => {  
        e.preventDefault();  
        clearMessage();  

        const email = document.getElementById('email').value;  
        const password = document.getElementById('password').value;  

        if (isSignUpMode) {  
            // Collect supplementary Sign-up payload fields  
            const username = document.getElementById('username').value;  
            const contact = document.getElementById('contact').value;  

            submitBtn.disabled = true;  
            submitBtn.textContent = "Creating Account...";  

            // Execute Supabase Auth Signup Command  
            const { data, error } = await supabase.auth.signUp({  
                email: email,  
                password: password,  
                options: {  
                    data: {  
                        username: username,  
                        contact: contact  
                    }  
                }  
            });  

            submitBtn.disabled = false;  
            submitBtn.textContent = "Sign Up";  

            if (error) {  
                showMessage(error.message, true);  
            } else {  
                // Check if confirmation email settings are enabled in your project  
                if (data.session === null) {  
                    showMessage("Sign up successful! Please check your email inbox to verify your account.", false);  
                } else {  
                    showMessage("Sign up successful! Logging you in...", false);  
                    window.location.href = "dashboard.html"; // Target home/dashboard site   
                }  
            }  

        } else {  
            // Execute Supabase Login Protocol  
            submitBtn.disabled = true;  
            submitBtn.textContent = "Verifying...";  

            const { data, error } = await supabase.auth.signInWithPassword({  
                email: email,  
                password: password,  
            });  

            submitBtn.disabled = false;  
            submitBtn.textContent = "Sign In";  

            if (error) {  
                showMessage(error.message, true);  
            } else {  
                showMessage("Login successful! Redirecting...", false);  
                // Save access token / forward user to internal platform  
                window.location.href = "dashboard.html";   
            }  
        }  
    });  
</script>

</body>  
</html>
