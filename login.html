
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Co Save & Earn | Login & Registration</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 22px 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #071e17, #14583c, #218453);
    }

    .card {
      width: 100%;
      max-width: 440px;
      padding: 26px 22px;
      border-radius: 20px;
      background: white;
      box-shadow: 0 15px 45px #0004;
    }

    .brand { text-align: center; margin-bottom: 24px; }

    .logo {
      display: grid;
      place-items: center;
      width: 60px;
      height: 60px;
      margin: 0 auto 12px;
      border-radius: 18px;
      background: #e3f5e9;
      font-size: 30px;
    }

    h1 { margin: 0; color: #176b48; font-size: 25px; }
    h2 { margin-bottom: 8px; color: #234332; font-size: 21px; }

    .sub {
      color: #718078;
      font-size: 14px;
      line-height: 1.5;
    }

    .tabs {
      display: flex;
      gap: 6px;
      padding: 5px;
      margin: 20px 0;
      border-radius: 11px;
      background: #edf4ef;
    }

    .tabs button {
      flex: 1;
      padding: 12px 5px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #456052;
      font-weight: bold;
      cursor: pointer;
    }

    .tabs button.active {
      background: #176b48;
      color: white;
    }

    .field { margin: 15px 0; }

    label {
      display: block;
      margin-bottom: 7px;
      color: #30483b;
      font-size: 13px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 14px 12px;
      border: 1px solid #d5e1d8;
      border-radius: 9px;
      background: #fcfefc;
      font-size: 15px;
    }

    input:focus {
      outline: 2px solid #b1dfc0;
      border-color: #176b48;
    }

    .main-btn {
      width: 100%;
      margin-top: 10px;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      background: #176b48;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .main-btn:disabled { opacity: .6; }

    .forgot {
      width: 100%;
      padding: 12px 0;
      border: 0;
      background: none;
      color: #176b48;
      text-align: right;
      cursor: pointer;
    }

    .message {
      display: none;
      padding: 12px;
      margin: 12px 0;
      border-radius: 9px;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .message.success {
      display: block;
      background: #e5f6e9;
      color: #155b3d;
    }

    .message.error {
      display: block;
      background: #fff0ee;
      color: #a52b25;
    }

    .hidden { display: none !important; }

    .footer {
      margin-top: 20px;
      color: #7a887f;
      text-align: center;
      font-size: 12px;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <main class="card">
    <header class="brand">
      <div class="logo">🌱</div>
      <h1>Co Save & Earn</h1>
      <p class="sub">Save • Grow • Earn</p>
    </header>

    <h2 id="heading">Welcome back</h2>
    <p class="sub" id="intro">Log in to your personal account.</p>

    <div class="tabs">
      <button type="button" id="loginTab" class="active">Log In</button>
      <button type="button" id="registerTab">Create Account</button>
    </div>

    <div id="message" class="message" role="status" aria-live="polite"></div>

    <!-- CREATE ACCOUNT FORM -->
    <form id="registerForm" class="hidden">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" type="text" autocomplete="username"
          placeholder="Enter your username" maxlength="100" required>
      </div>

      <div class="field">
        <label for="contact">Contact / Mobile Number</label>
        <input id="contact" type="tel" autocomplete="tel"
          placeholder="Enter your mobile number" maxlength="25" required>
      </div>

      <div class="field">
        <label for="registerEmail">Email Address</label>
        <input id="registerEmail" type="email" autocomplete="email"
          placeholder="Enter your email address" required>
      </div>

      <div class="field">
        <label for="registerPassword">Password</label>
        <input id="registerPassword" type="password"
          autocomplete="new-password" minlength="8"
          placeholder="Create a password (minimum 8 characters)" required>
      </div>

      <button type="submit" class="main-btn" id="registerButton">
        Create Account
      </button>
    </form>

    <!-- LOGIN FORM -->
    <form id="loginForm">
      <div class="field">
        <label for="loginEmail">Email Address</label>
        <input id="loginEmail" type="email" autocomplete="email"
          placeholder="Enter your registered email" required>
      </div>

      <div class="field">
        <label for="loginPassword">Password</label>
        <input id="loginPassword" type="password"
          autocomplete="current-password"
          placeholder="Enter your password" required>
      </div>

      <button type="button" class="forgot" id="forgotButton">
        Forgot password?
      </button>

      <button type="submit" class="main-btn" id="loginButton">
        Log In
      </button>
    </form>

    <div class="footer">
      Your account is managed securely by Supabase Authentication.
    </div>
  </main>

  <script>
    // EXISTING CO SAVE & EARN SUPABASE PROJECT
    const SUPABASE_URL =
      "https://chjtxxwxhvjwpspmikme.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_g8M0qRrMveb8A7H3BLYYg_g21-SBKA";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const $ = id => document.getElementById(id);
    const registerForm = $("registerForm");
    const loginForm = $("loginForm");
    const message = $("message");

    function showMessage(text, type) {
      message.textContent = text;
      message.className = "message " + type;
    }

    function clearMessage() {
      message.textContent = "";
      message.className = "message";
    }

    function setMode(mode) {
      clearMessage();

      const isRegister = mode === "register";

      registerForm.classList.toggle("hidden", !isRegister);
      loginForm.classList.toggle("hidden", isRegister);
      $("registerTab").classList.toggle("active", isRegister);
      $("loginTab").classList.toggle("active", !isRegister);

      $("heading").textContent = isRegister
        ? "Create your account" : "Welcome back";

      $("intro").textContent = isRegister
        ? "Enter your details to join Co Save & Earn."
        : "Log in to your personal account.";
    }

    $("loginTab").addEventListener("click", () => setMode("login"));
    $("registerTab").addEventListener("click", () => setMode("register"));

    // REGISTER: email and password go to Supabase Authentication.
    registerForm.addEventListener("submit", async function(event) {
      event.preventDefault();
      clearMessage();

      const username = $("username").value.trim();
      const contact = $("contact").value.trim();
      const email = $("registerEmail").value.trim();
      const password = $("registerPassword").value;

      if (!username || !contact || !email || !password) {
        showMessage("Please complete all four fields.", "error");
        return;
      }

      if (password.length < 8) {
        showMessage("Password must be at least 8 characters.", "error");
        return;
      }

      const button = $("registerButton");
      button.disabled = true;
      button.textContent = "Creating account...";

      try {
        const { data, error } = await supabaseClient.auth.signUp({
          email: email,
          password: password,
          options: {
            data: {
              full_name: username,
              username: username,
              mobile_number: contact,
              phone: contact
            },
            emailRedirectTo:
              "https://co-save-earnai.github.io/Co-earner/login.html"
          }
        });

        if (error) throw error;

        if (!data.user) {
          throw new Error(
            "Supabase did not return a user. Please try again."
          );
        }

        if (data.session) {
          showMessage(
            "Your account was created successfully. Opening your dashboard...",
            "success"
          );

          window.location.assign(
            "https://co-save-earnai.github.io/Co-earner/dashboard.html"
          );
          return;
        }

        showMessage(
          "Registration submitted successfully. Check your email for a confirmation link if required. " +
          "Now check Supabase → Authentication → Users for the registered email. " +
          "After confirming your email, log in here.",
          "success"
        );

        registerForm.reset();

      } catch (error) {
        showMessage(
          "Registration failed: " + (error.message || "Unknown error"),
          "error"
        );
      } finally {
        button.disabled = false;
        button.textContent = "Create Account";
      }
    });

    // LOGIN: verifies the actual Supabase account.
    loginForm.addEventListener("submit", async function(event) {
      event.preventDefault();
      clearMessage();

      const email = $("loginEmail").value.trim();
      const password = $("loginPassword").value;
      const button = $("loginButton");

      button.disabled = true;
      button.textContent = "Logging in...";

      try {
        const { data, error } =
          await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
          });

        if (error) throw error;

        if (!data.session) {
          throw new Error("Login did not create a session. Please try again.");
        }

        window.location.assign(
          "https://co-save-earnai.github.io/Co-earner/dashboard.html"
        );

      } catch (error) {
        showMessage("Login failed: " + error.message, "error");
      } finally {
        button.disabled = false;
        button.textContent = "Log In";
      }
    });

    // PASSWORD RESET
    $("forgotButton").addEventListener("click", async function() {
      clearMessage();

      const email = $("loginEmail").value.trim();

      if (!email) {
        showMessage("Enter your email address first.", "error");
        return;
      }

      try {
        const { error } =
          await supabaseClient.auth.resetPasswordForEmail(email, {
            redirectTo:
              "https://co-save-earnai.github.io/Co-earner/login.html"
          });

        if (error) throw error;

        showMessage(
          "If this email is registered, Supabase will send password-reset instructions.",
          "success"
        );

      } catch (error) {
        showMessage("Password reset failed: " + error.message, "error");
      }
    });
  })();
  </script>
</body>
        </html>
