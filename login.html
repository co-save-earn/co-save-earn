<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Co Save & Earn | Login</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#e4f6e9,#c6e7d2);
  color:#173b2b
}
.card{
  width:100%;
  max-width:430px;
  padding:28px 23px;
  background:white;
  border-radius:20px;
  box-shadow:0 12px 40px #173b2b20
}
.brand{
  text-align:center;
  font-size:27px;
  font-weight:bold;
  color:#087443
}
.tagline{
  text-align:center;
  margin:9px 0 25px;
  color:#728078
}
.tabs{
  display:flex;
  gap:8px;
  background:#eef5ef;
  padding:5px;
  border-radius:12px
}
.tabs button{
  width:50%;
  padding:12px 5px;
  border:0;
  border-radius:9px;
  background:transparent;
  color:#496354;
  font-weight:bold;
  cursor:pointer
}
.tabs button.active{
  background:#087443;
  color:white
}
h2{margin:23px 0 8px;font-size:23px}
.desc{color:#728078;font-size:14px;line-height:1.5}
label{
  display:block;
  margin:17px 0 7px;
  font-size:14px;
  font-weight:bold
}
input{
  display:block;
  width:100%;
  padding:13px;
  border:1px solid #d5e1d8;
  border-radius:10px;
  font-size:15px;
  background:white
}
input:focus{outline:2px solid #a8d9b9;border-color:#087443}
.primary{
  width:100%;
  margin-top:23px;
  padding:14px;
  background:#087443;
  color:white;
  border:0;
  border-radius:10px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer
}
.primary:disabled{opacity:.6}
.link{
  display:block;
  text-align:right;
  margin-top:14px;
  color:#087443;
  font-size:14px;
  cursor:pointer
}
.message{
  display:none;
  margin-top:17px;
  padding:12px;
  border-radius:9px;
  font-size:14px;
  line-height:1.5;
  overflow-wrap:anywhere
}
.message.show{display:block}
.message.error{background:#fff0f0;color:#9b2525}
.message.success{background:#e8f7ed;color:#08613a}
.footer{
  text-align:center;
  margin-top:24px;
  font-size:12px;
  color:#849087
}
[hidden]{display:none!important}
</style>
</head>

<body>
<main class="card">
  <div class="brand">Co Save & Earn</div>
  <div class="tagline">Save • Grow • Earn</div>

  <div class="tabs">
    <button id="loginTab" class="active" type="button">Log In</button>
    <button id="signupTab" type="button">Create Account</button>
  </div>

  <h2 id="heading">Welcome back!</h2>
  <p class="desc" id="description">Log in to continue to your account.</p>

  <form id="authForm">
    <div id="nameGroup" hidden>
      <label for="fullName">Full name</label>
      <input id="fullName" type="text" autocomplete="name"
             placeholder="Enter your full name">
    </div>

    <label for="email">Email address</label>
    <input id="email" type="email" required autocomplete="email"
           placeholder="Enter your email address">

    <label for="password">Password</label>
    <input id="password" type="password" required minlength="6"
           autocomplete="current-password"
           placeholder="Enter your password">

    <div id="confirmGroup" hidden>
      <label for="confirmPassword">Confirm password</label>
      <input id="confirmPassword" type="password" minlength="6"
             autocomplete="new-password"
             placeholder="Re-enter your password">
    </div>

    <span id="forgot" class="link">Forgot password?</span>

    <button id="submitButton" class="primary" type="submit">
      Log In
    </button>

    <div id="message" class="message" role="status"
         aria-live="polite"></div>
  </form>

  <div class="footer">Your savings journey starts here.</div>
</main>

<script type="module">
import { createClient } from
'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL =
'https://chjtxxwxhvjwpspmikme.supabase.co';

const SUPABASE_KEY =
'sb_publishable_g8gM0qRrMveb8A7H3BLYYg_g21-SBKA';

const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);
let mode = 'login';
let busy = false;

function message(text, type='error') {
  $('message').textContent = text;
  $('message').className = 'message show ' + type;
}

function clearMessage() {
  $('message').textContent = '';
  $('message').className = 'message';
}

function switchMode(next) {
  mode = next;
  const signup = mode === 'signup';

  clearMessage();
  $('loginTab').classList.toggle('active', !signup);
  $('signupTab').classList.toggle('active', signup);

  $('nameGroup').hidden = !signup;
  $('confirmGroup').hidden = !signup;
  $('forgot').hidden = signup;

  $('fullName').required = signup;
  $('confirmPassword').required = signup;

  $('heading').textContent = signup
    ? 'Create your account'
    : 'Welcome back!';

  $('description').textContent = signup
    ? 'Register with your email to get started.'
    : 'Log in to continue to your account.';

  $('submitButton').textContent = signup
    ? 'Create Account'
    : 'Log In';

  $('password').autocomplete = signup
    ? 'new-password'
    : 'current-password';
}

$('loginTab').addEventListener('click', () => switchMode('login'));
$('signupTab').addEventListener('click', () => switchMode('signup'));

$('authForm').addEventListener('submit', async event => {
  event.preventDefault();
  if (busy) return;

  clearMessage();

  const email = $('email').value.trim();
  const password = $('password').value;
  const fullName = $('fullName').value.trim();

  if (mode === 'signup') {
    if (!fullName) {
      message('Please enter your full name.');
      return;
    }

    if (password !== $('confirmPassword').value) {
      message('The passwords do not match.');
      return;
    }
  }

  busy = true;
  $('submitButton').disabled = true;
  $('submitButton').textContent = 'Please wait...';

  try {
    if (mode === 'signup') {
      const { data, error } = await supabase.auth.signUp({
        email,
        password,
        options: {
          data: { full_name: fullName },
          emailRedirectTo: new URL(
            'login.html', window.location.href
          ).href
        }
      });

      if (error) throw error;

      if (data.session) {
        message('Account created! Opening your dashboard...', 'success');
        window.location.assign('dashboard.html');
        return;
      }

      message(
        'Registration received. Check your email and confirm your account before logging in.',
        'success'
      );
      switchMode('login');

    } else {
      const { data, error } =
        await supabase.auth.signInWithPassword({ email, password });

      if (error) throw error;

      if (!data.session) {
        throw new Error('Login did not create a session. Please try again.');
      }

      message('Login successful. Opening your dashboard...', 'success');
      window.location.assign('dashboard.html');
      return;
    }
  } catch (error) {
    message(error.message || 'Something went wrong. Please try again.');
  } finally {
    busy = false;
    $('submitButton').disabled = false;
    $('submitButton').textContent = mode === 'signup'
      ? 'Create Account'
      : 'Log In';
  }
});

$('forgot').addEventListener('click', async () => {
  clearMessage();
  const email = $('email').value.trim();

  if (!email) {
    message('Enter your email address first.');
    $('email').focus();
    return;
  }

  try {
    const { error } = await supabase.auth.resetPasswordForEmail(
      email,
      {
        redirectTo: new URL('login.html', window.location.href).href
      }
    );

    if (error) throw error;

    message(
      'If an account exists for this email, password-reset instructions will be sent.',
      'success'
    );
  } catch (error) {
    message(error.message || 'Could not request a password reset.');
  }
});

// If already signed in, open the dashboard.
const { data: sessionData } = await supabase.auth.getSession();

if (sessionData.session) {
  window.location.replace('dashboard.html');
}
</script>
</body>
    </html>
