
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Co Save & Earn</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;padding:22px 14px;
  display:flex;align-items:center;justify-content:center;
  font-family:Arial,sans-serif;
  background:linear-gradient(140deg,#071d18,#124c36,#218354);
}
.card{
  background:white;width:100%;max-width:430px;
  padding:26px 22px;border-radius:20px;
  box-shadow:0 15px 45px #0004;
}
.brand{text-align:center;margin-bottom:22px}
.logo{
  margin:auto auto 12px;width:58px;height:58px;
  display:grid;place-items:center;border-radius:17px;
  background:#e3f5e9;font-size:29px;
}
h1{font-size:25px;margin:0;color:#155b3d}
h2{font-size:21px;color:#203c2e;margin-bottom:8px}
.sub{color:#748078;font-size:14px;line-height:1.5}
.tabs{display:flex;gap:6px;background:#edf4ef;padding:5px;
  border-radius:11px;margin:20px 0}
.tabs button{flex:1;border:0;padding:12px 5px;
  border-radius:8px;background:transparent;font-weight:bold;color:#42604e}
.tabs button.active{background:#176b48;color:white}
.field{margin:14px 0}
label{display:block;font-size:13px;font-weight:bold;
  margin-bottom:7px;color:#30483b}
input{width:100%;padding:14px 12px;border:1px solid #d5e1d8;
  border-radius:9px;font-size:15px;background:#fcfefc}
input:focus{outline:2px solid #a4d8b6;border-color:#176b48}
.main{
  width:100%;padding:14px;border:0;border-radius:10px;
  color:white;background:#176b48;font-size:16px;
  font-weight:bold;margin-top:10px;cursor:pointer}
.main:disabled{opacity:.6}
.forgot{width:100%;text-align:right;border:0;background:none;
  color:#176b48;padding:12px 0;cursor:pointer}
.msg{display:none;padding:12px;border-radius:9px;
  font-size:14px;line-height:1.5;overflow-wrap:anywhere;margin:12px 0}
.msg.ok{display:block;background:#e5f6e9;color:#155b3d}
.msg.bad{display:block;background:#fff0ee;color:#a52b25}
.hidden{display:none!important}
.foot{text-align:center;font-size:12px;color:#7a887f;margin-top:20px}
</style>
</head>

<body>
<main class="card">
  <header class="brand">
    <div class="logo">🌱</div>
    <h1>Co Save & Earn</h1>
    <p class="sub">Save • Grow • Earn</p>
  </header>

  <h2 id="heading">Welcome back</h2>
  <p class="sub" id="intro">Log in to your personal account.</p>

  <div class="tabs">
    <button type="button" id="loginTab" class="active">Log In</button>
    <button type="button" id="registerTab">Create Account</button>
  </div>

  <div id="message" class="msg" role="status" aria-live="polite"></div>

  <form id="registerForm" class="hidden">
    <div class="field">
      <label for="fullName">Full Name</label>
      <input id="fullName" type="text" autocomplete="name"
        placeholder="Enter your full name" required maxlength="100">
    </div>

    <div class="field">
      <label for="mobile">Mobile Number</label>
      <input id="mobile" type="tel" autocomplete="tel"
        placeholder="Enter your mobile number" required maxlength="20">
    </div>

    <div class="field">
      <label for="registerEmail">Email Address</label>
      <input id="registerEmail" type="email" autocomplete="email"
        placeholder="Enter your email address" required>
    </div>

    <div class="field">
      <label for="registerPassword">Password</label>
      <input id="registerPassword" type="password"
        autocomplete="new-password" minlength="8"
        placeholder="Create a password (8+ characters)" required>
    </div>

    <button class="main" id="registerButton" type="submit">
      Create Account
    </button>
  </form>

  <form id="loginForm">
    <div class="field">
      <label for="loginEmail">Email Address</label>
      <input id="loginEmail" type="email" autocomplete="email"
        placeholder="Enter your email address" required>
    </div>

    <div class="field">
      <label for="loginPassword">Password</label>
      <input id="loginPassword" type="password"
        autocomplete="current-password"
        placeholder="Enter your password" required>
    </div>

    <button type="button" class="forgot" id="forgotButton">
      Forgot password?
    </button>

    <button class="main" id="loginButton" type="submit">
      Log In
    </button>
  </form>

  <div class="foot">
    Secure account access powered by Supabase.
  </div>
</main>

<script>
(function () {
  const SUPABASE_URL =
    "https://chjtxxwxhvjwpspmikme.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_g8gM0qRrMveb8A7H3BLYYg_g21-SBKA";

  const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  const $ = id => document.getElementById(id);
  const registerForm = $("registerForm");
  const loginForm = $("loginForm");
  const message = $("message");

  function showMessage(text, type) {
    message.textContent = text;
    message.className = "msg " + type;
  }

  function clearMessage() {
    message.textContent = "";
    message.className = "msg";
  }

  function setMode(mode) {
    clearMessage();
    const registering = mode === "register";

    registerForm.classList.toggle("hidden", !registering);
    loginForm.classList.toggle("hidden", registering);
    $("registerTab").classList.toggle("active", registering);
    $("loginTab").classList.toggle("active", !registering);

    $("heading").textContent = registering
      ? "Create your account" : "Welcome back";

    $("intro").textContent = registering
      ? "Enter your details to join Co Save & Earn."
      : "Log in to your personal account.";
  }

  $("loginTab").addEventListener("click", () => setMode("login"));
  $("registerTab").addEventListener("click", () => setMode("register"));

  // REGISTER: create a real Supabase Authentication account.
  registerForm.addEventListener("submit", async function (event) {
    event.preventDefault();
    clearMessage();

    const fullName = $("fullName").value.trim();
    const mobile = $("mobile").value.trim();
    const email = $("registerEmail").value.trim();
    const password = $("registerPassword").value;

    if (!fullName || !mobile || !email || !password) {
      showMessage("Please fill in all four fields.", "bad");
      return;
    }

    const button = $("registerButton");
    button.disabled = true;
    button.textContent = "Creating account...";

    try {
      const { data, error } = await db.auth.signUp({
        email: email,
        password: password,
        options: {
          data: {
            full_name: fullName,
            mobile_number: mobile
          },
          emailRedirectTo:
            "https://co-save-earnai.github.io/Co-earner/login.html"
        }
      });

      if (error) throw error;

      if (data.session) {
        showMessage("Account created. Opening your dashboard...", "ok");
        window.location.href =
          "https://co-save-earnai.github.io/Co-earner/dashboard.html";
        return;
      }

      showMessage(
        "Registration submitted. Check your email for a confirmation link. " +
        "Your account should appear in Supabase Authentication → Users. " +
        "After confirming, return here to log in.",
        "ok"
      );

      registerForm.reset();

    } catch (error) {
      showMessage("Registration failed: " + error.message, "bad");
    } finally {
      button.disabled = false;
      button.textContent = "Create Account";
    }
  });

  // LOGIN: verify credentials with Supabase.
  loginForm.addEventListener("submit", async function (event) {
    event.preventDefault();
    clearMessage();

    const email = $("loginEmail").value.trim();
    const password = $("loginPassword").value;
    const button = $("loginButton");

    button.disabled = true;
    button.textContent = "Logging in...";

    try {
      const { error } = await db.auth.signInWithPassword({
        email: email,
        password: password
      });

      if (error) throw error;

      window.location.href =
        "https://co-save-earnai.github.io/Co-earner/dashboard.html";

    } catch (error) {
      showMessage("Login failed: " + error.message, "bad");
    } finally {
      button.disabled = false;
      button.textContent = "Log In";
    }
  });

  // PASSWORD RESET.
  $("forgotButton").addEventListener("click", async function () {
    clearMessage();
    const email = $("loginEmail").value.trim();

    if (!email) {
      showMessage("Enter your email address first.", "bad");
      return;
    }

    try {
      const { error } = await db.auth.resetPasswordForEmail(email, {
        redirectTo:
          "https://co-save-earnai.github.io/Co-earner/login.html"
      });

      if (error) throw error;

      showMessage(
        "If the address is registered, password-reset instructions will be sent to that email.",
        "ok"
      );
    } catch (error) {
      showMessage("Password reset failed: " + error.message, "bad");
    }
  });
})();
</script>
</body>
  </html>
