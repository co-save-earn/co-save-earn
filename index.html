<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Co Save & Earn</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#f5f7fb;color:#172033}
.hero{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:25px}
.box{background:white;width:100%;max-width:450px;padding:30px;border-radius:25px;box-shadow:0 8px 30px #0001;text-align:center}
.logo{font-size:30px;font-weight:bold;color:#183b56}
.sub{color:#687386;margin:10px 0 25px}
input{width:100%;padding:14px;margin:7px 0;border:1px solid #d7dde5;border-radius:10px;font-size:15px}
button{width:100%;padding:14px;border:0;border-radius:10px;background:#246b8f;color:white;font-weight:bold;font-size:15px;margin-top:10px}
.login{background:white;color:#246b8f;border:1px solid #246b8f}
.note{font-size:12px;color:#777;margin-top:18px;line-height:1.5}
</style>
</head>
<body>

<div class="hero">
<div class="box">

<div class="logo">Co Save & Earn</div>
<p class="sub">Save • Grow • Earn</p>

<h2>Create Account</h2>

<input id="name" placeholder="Full name">
<input id="phone" placeholder="Mobile number">
<input id="password" type="password" placeholder="Create password">

<button onclick="createAccount()">Create Account</button>

<button class="login" onclick="location.href='login.html'">
Already have an account? Log In
</button>

<p class="note">
By creating an account you can access your savings dashboard,
saving plans, deposits, withdrawals, referrals and rewards.
</p>

</div>
</div>

<script>
function createAccount(){

const name=document.getElementById("name").value.trim();
const phone=document.getElementById("phone").value.trim();
const password=document.getElementById("password").value;

if(!name||!phone||!password){
alert("Please complete all fields.");
return;
}

const account={
name:name,
phone:phone,
password:password,
provider:"",
balance:0,
referralCode:"CO"+Math.floor(100000+Math.random()*900000),
referrals:0,
transactions:[],
activePlans:[]
};

localStorage.setItem("coEarnerAccount",JSON.stringify(account));
localStorage.setItem("coLoggedIn","true");

alert("Account created successfully!");
location.href="dashboard.html";
}
</script>

</body>
</html>
