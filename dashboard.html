<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Co Save & Earn - Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fb;
            color: #222;
        }

        header {
            background: #176b4d;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 22px;
        }

        .logout {
            background: white;
            color: #176b4d;
            border: none;
            padding: 9px 15px;
            border-radius: 6px;
            cursor: pointer;
        }

        .container {
            padding: 25px;
            max-width: 1100px;
            margin: auto;
        }

        .welcome {
            margin-bottom: 25px;
        }

        .welcome h2 {
            margin-bottom: 8px;
        }

        .balance {
            background: #176b4d;
            color: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        .balance p {
            margin-bottom: 10px;
        }

        .balance h2 {
            font-size: 32px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 22px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .card h3 {
            margin-bottom: 10px;
        }

        .card p {
            font-size: 24px;
            font-weight: bold;
        }

        .actions {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .action {
            background: white;
            border: none;
            padding: 18px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .transactions {
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        .transaction {
            display: flex;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 1px solid #eee;
        }

        .positive {
            color: green;
        }

        .negative {
            color: red;
        }

        @media (max-width: 600px) {
            .cards,
            .actions {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Co Save & Earn</h1>
    <button class="logout">Logout</button>
</header>

<div class="container">

    <div class="welcome">
        <h2>Welcome back! 👋</h2>
        <p>Manage your savings and earnings.</p>
    </div>

    <div class="balance">
        <p>Total Balance</p>
        <h2>UGX 250,000</h2>
    </div>

    <div class="cards">

        <div class="card">
            <h3>Total Savings</h3>
            <p>UGX 200,000</p>
        </div>

        <div class="card">
            <h3>Total Earnings</h3>
            <p>UGX 50,000</p>
        </div>

    </div>

    <div class="actions">

        <button class="action">
            💰<br><br>
            Save Money
        </button>

        <button class="action">
            📈<br><br>
            Earn
        </button>

        <button class="action">
            💸<br><br>
            Withdraw
        </button>

    </div>

    <div class="transactions">

        <h2>Recent Transactions</h2>

        <div class="transaction">
            <span>Saving Deposit</span>
            <strong class="positive">+ UGX 20,000</strong>
        </div>

        <div class="transaction">
            <span>Earning</span>
            <strong class="positive">+ UGX 5,000</strong>
        </div>

        <div class="transaction">
            <span>Withdrawal</span>
            <strong class="negative">- UGX 10,000</strong>
        </div>

    </div>

</div>

</body>
  </html>
