
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | Co Save & Earn</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --green: #073e30;
      --deep: #032b22;
      --emerald: #0e6148;
      --gold: #e8c66b;
      --cream: #f6f5ee;
      --ink: #193329;
      --muted: #77857b;
      --line: #e0e7df;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top right, #dce9d8, transparent 45%),
        var(--cream);
      font-family: Arial, Helvetica, sans-serif;
      color: var(--ink);
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--deep);
      color: white;
      padding: 17px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 43px;
      height: 43px;
      display: grid;
      place-items: center;
      border-radius: 13px;
      background: var(--gold);
      color: var(--deep);
      font-size: 25px;
    }

    header h1 { font-size: 18px; margin: 0; }
    header p {
      color: #cbdcd2;
      margin: 5px 0 0;
      font-size: 10px;
      letter-spacing: 1.5px;
    }

    main {
      flex: 1;
      width: 100%;
      max-width: 480px;
      padding: 28px 16px;
      margin: auto;
    }

    .intro { text-align: center; margin-bottom: 22px; }

    .intro h2 {
      font-size: 29px;
      margin: 0 0 9px;
      color: var(--green);
    }

    .intro p {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.6;
      margin: 0;
    }

    .card {
      background: white;
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 21px;
      box-shadow: 0 15px 45px #123c2010;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
      background: #f0f3ed;
      padding: 5px;
      border-radius: 12px;
      margin-bottom: 22px;
    }

    .tab {
      padding: 12px 6px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: var(--muted);
      font-weight: bold;
      font-size: 13px;
    }

    .tab.active {
      background: var(--green);
      color: white;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-bottom: 15px;
    }

    label {
      font-size: 12px;
      font-weight: bold;
      color: #506156;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: 10px;
      outline: none;
      background: white;
      color: var(--ink);
      font-size: 14px;
    }

    input:focus {
      border-color: var(--emerald);
      box-shadow: 0 0 0 3px #0e614814;
    }

    .submit {
      width: 100%;
      border: 0;
      border-radius: 11px;
      padding: 14px;
      background: var(--green);
      color: white;
      font-weight: bold;
      font-size: 14px;
      margin-top: 5px;
    }

    .submit:disabled {
      opacity: .6;
      cursor: wait;
    }

    .message {
      display: none;
      padding: 12px;
      margin-bottom: 15px;
      border-radius: 10px;
      font-size: 12px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .message.show { display: block; }
    .message.error { background: #ffebeb; color: #982e2e; }
    .message.success { background: #e3f5e8; color: #216a40; }
    .message.info { background: #fff5d9; color: #725b1d; }

    .hint {
      font-size: 11px;
      line-height: 1.6;
      color: var(--muted);
      text-align: center;
      margin: 16px 0 0;
    }

    .hidden { display: none !important; }

    footer {
      text-align: center;
      padding: 18px;
      color: var(--muted);
      font-size: 11px;
    }

    @media (max-width: 360px) {
      .card { padding: 16px; }
      .intro h2 { font-size: 25px; }
    }
  </style>
</head>

<body>
<header>
  <div class="logo">✦</div>
  <div>
    <h1>Co Save & Earn</h1>
    <p>SAVE. GROW. EARN.</p>
  </div>
</header>

<main>
  <div class="intro">
    <h2 id="heading">Welcome back</h2>
    <p id="subtitle">Log in to access your personal savings dashboard.</p>
  </div>

  <div class="card">
    <div class="tabs">
      <button type="button" class="tab active" id="loginTab"
        onclick="switchMode('login')">Log in</button>
      <button type="button" class="tab" id="registerTab"
        onclick="switchMode('register')">Create account</button>
    </div>

    <div id="message" class="message" role="status" aria-live="polite"></div>

    <form id="authForm">
      <div id="registerFields" class="hidden">
        <div class="field">
          <label for="username">Username</label>
          <input id="username" type="text" autocomplete="username"
            placeholder="Choose a username" minlength="2" maxlength="40">
        </div>

        <div class="field">
          <label for="contact">Contact number</label>
          <input id="contact" type="tel" autocomplete="tel"
            placeholder="Your mobile number">
        </div>
      </div>

      <div class="field">
        <label for="email">Email address</label>
        <input id="email" type="email" autocomplete="email"
          placeholder="you@example.com" required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password"
          autocomplete="current-password" minlength="6"
          placeholder="At least 6 characters" required>
      </div>

      <div id="confirmField" class="field hidden">
        <label for="confirmPassword">Confirm password</label>
        <input id="confirmPassword" type="password"
          autocomplete="new-password" minlength="6"
          placeholder="Enter your password again">
      </div>

      <button class="submit" id="submitButton" type="submit">
        Log in
      </button>
    </form>

    <p class="hint" id="hint">
      Use the email address and password registered to your account.
    </p>
  </div>
</main>

<footer>Co Save & Earn · Your account, your savings.</footer>

<script>
const SUPABASE_URL = "https://chjtxxwxhvjwpspmikme.supabase.co";
const SUPABASE_KEY = "sb_publishable_g8gM0qRrMveb8A7H3BLYYg_g21-SBKA";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let mode = "login";

function showMessage(text, type = "info") {
  const box = document.getElementById("message");
  box.textContent = text;
  box.className = "message show " + type;
}

function clearMessage() {
  const box = document.getElementById("message");
  box.textContent = "";
  box.className = "message";
}

function switchMode(newMode) {
  mode = newMode;
  clearMessage();

  const registering = mode === "register";

  document.getElementById("registerFields").classList.toggle(
    "hidden", !registering
  );
  document.getElementById("confirmField").classList.toggle(
    "hidden", !registering
  );

  document.getElementById("loginTab").classList.toggle(
    "active", !registering
  );
  document.getElementById("registerTab").classList.toggle(
    "active", registering
  );

  document.getElementById("heading").textContent =
    registering ? "Create your account" : "Welcome back";

  document.getElementById("subtitle").textContent =
    registering
      ? "Register to create your own personal account."
      : "Log in to access your personal savings dashboard.";

  document.getElementById("submitButton").textContent =
    registering ? "Create account" : "Log in";

  document.getElementById("hint").textContent =
    registering
      ? "Use an email address you can access. Email confirmation may be required."
      : "Use the email address and password registered to your account.";

  document.getElementById("password").autocomplete =
    registering ? "new-password" : "current-password";

  document.getElementById("username").required = registering;
  document.getElementById("confirmPassword").required = registering;
}

async function saveProfile(user, username, contact) {
  const profile = {
    id: user.id,
    username: username || user.user_metadata?.username ||
      user.email?.split("@")[0] || "Member",
    contact: contact || user.user_metadata?.contact || ""
  };

  const { error } = await db
    .from("profiles")
    .upsert(profile, { onConflict: "id" });

  if (error) {
    console.error("Profile save error:", error.message);
    return error;
  }

  return null;
}

document.getElementById("authForm").addEventListener(
  "submit", async function(event) {
    event.preventDefault();
    clearMessage();

    const button = document.getElementById("submitButton");
    const email = document.getElementById("email").value.trim().toLowerCase();
    const password = document.getElementById("password").value;

    button.disabled = true;
    button.textContent = mode === "register"
      ? "Creating account..."
      : "Logging in...";

    try {
      if (mode === "register") {
        const username = document.getElementById("username").value.trim();
        const contact = document.getElementById("contact").value.trim();
        const confirmPassword =
          document.getElementById("confirmPassword").value;

        if (username.length < 2) {
          throw new Error("Please enter a username with at least 2 characters.");
        }

        if (password.length < 6) {
          throw new Error("Your password must have at least 6 characters.");
        }

        if (password !== confirmPassword) {
          throw new Error("Your passwords do not match.");
        }

        const redirectURL = new URL("login.html", window.location.href);
        const referral = new URLSearchParams(window.location.search).get("ref");

        const userMetadata = { username, contact };
        if (referral) userMetadata.referred_by = referral;

        const { data, error } = await db.auth.signUp({
          email,
          password,
          options: {
            emailRedirectTo: redirectURL.href,
            data: userMetadata
          }
        });

        if (error) throw error;

        if (!data.user) {
          throw new Error(
            "Supabase did not return a user. Please try again."
          );
        }

        if (data.session) {
          const profileError = await saveProfile(
            data.user, username, contact
          );

          if (profileError) {
            showMessage(
              "Your account was created, but the profile could not be saved. " +
              "Check your profiles table and Row Level Security policies. " +
              profileError.message,
              "error"
            );
            return;
          }

          showMessage(
            "Account created successfully. Opening your dashboard...",
            "success"
          );

          window.location.href = "dashboard.html";
          return;
        }

        showMessage(
          "Your registration was submitted. Check your email for a " +
          "confirmation link if email confirmation is enabled in Supabase. " +
          "After confirming, return here and log in.",
          "success"
        );

        switchMode("login");
        document.getElementById("email").value = email;
      } else {
        const { data, error } = await db.auth.signInWithPassword({
          email,
          password
        });

        if (error) throw error;
        if (!data.user) throw new Error("Login failed. Please try again.");

        const metadata = data.user.user_metadata || {};

        const profileError = await saveProfile(
          data.user,
          metadata.username || data.user.email?.split("@")[0] || "Member",
          metadata.contact || ""
        );

        if (profileError) {
          showMessage(
            "You logged in, but your profile could not be saved. " +
            "Check your profiles table and access policies: " +
            profileError.message,
            "error"
          );
          return;
        }

        showMessage("Login successful. Opening your dashboard...", "success");
        window.location.href = "dashboard.html";
      }
    } catch (error) {
      showMessage(
        error.message || "Something went wrong. Please try again.",
        "error"
      );
    } finally {
      button.disabled = false;
      button.textContent = mode === "register"
        ? "Create account"
        : "Log in";
    }
  }
);

// If a valid Supabase session already exists, continue to the dashboard.
async function checkExistingSession() {
  const { data, error } = await db.auth.getSession();

  if (!error && data.session) {
    window.location.href = "dashboard.html";
  }
}

checkExistingSession();
</script>
</body>
          </html>
